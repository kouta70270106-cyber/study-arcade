<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4f1ea"/>
      <stop offset="1" stop-color="#8fd1c3"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" fill="url(#bg)"/>
  <!-- 背景に散らばる数字 -->
  <g font-family="Arial, sans-serif" font-weight="700" fill="#2f9e8f" fill-opacity="0.28">
    <text x="28" y="60" font-size="34">17</text>
    <text x="236" y="56" font-size="30">42</text>
    <text x="40" y="206" font-size="28">88</text>
    <text x="226" y="214" font-size="34">100</text>
    <text x="128" y="44" font-size="22">3</text>
    <text x="270" y="140" font-size="24">65</text>
    <text x="14" y="140" font-size="22">29</text>
  </g>
  <!-- 真ん中の「？」 -->
  <circle cx="160" cy="124" r="64" fill="#ffffff" fill-opacity="0.85"/>
  <text x="160" y="160" font-size="104" font-weight="900" font-family="Arial Black, sans-serif"
        text-anchor="middle" fill="#2f9e8f">?</text>
  <!-- 大きい・小さいのヒント -->
  <g font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="#ffffff"
     stroke="#2f9e8f" stroke-width="3" paint-order="stroke" text-anchor="middle">
    <text x="236" y="104">▲</text>
    <text x="84" y="166">▼</text>
  </g>
</svg>
